name: discord dev log

# Posts a plain-language dev log entry to Discord whenever a PR is merged into main.
# The text comes from the PR description's "## Dev log" section; without one, the PR title is
# posted. No usernames, stats or file lists. Needs a repo secret DISCORD_WEBHOOK_URL
# (Discord channel > Integrations > Webhooks).
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  notify:
    # pull_request_target so fork PRs can see the secret; nothing from the PR is checked out
    # or executed, and all PR text reaches the script through env vars, never ${{ }} in run.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Post dev log to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set; skipping Discord post."
            exit 0
          fi

          # The "## Dev log" section of the PR description, up to the next heading.
          devlog=$(printf '%s' "$PR_BODY" | tr -d '\r' \
            | awk 'tolower($0) ~ /^#+[[:space:]]*dev log[[:space:]]*$/ { on = 1; next }
                   on && /^#+[[:space:]]/ { exit }
                   on { print }' \
            | perl -0pe 's/<!--.*?-->//gs; s/^.*Generated with \[Claude Code\].*$//mg; s/^https:\/\/claude\.ai\/code\/\S+\s*$//mg; s/^-{3,}\s*$//mg; s/^_Generated by .*$//mg; s/\n{3,}/\n\n/g; s/^\s+|\s+$//g')
          if [ ${#devlog} -gt 2000 ]; then
            devlog="${devlog:0:2000}…"
          fi

          if [ -n "$devlog" ]; then
            title="$PR_TITLE"
            description="$devlog"
          else
            title="Update"
            description="$PR_TITLE"
          fi

          payload=$(jq -n \
            --arg title "$title" \
            --arg description "$description" \
            --arg merged_at "$MERGED_AT" \
            '{
              username: "PigsGonnaBlow Dev Log",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: ($title | .[0:256]),
                description: $description,
                color: 16738740,
                timestamp: $merged_at
              }]
            }')

          curl -fsS -X POST -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
          echo "Posted dev log to Discord."
